syntax = "proto3";

package campuslab.v1;

// Campus Lab student records over gRPC. A practice service for learning gRPC testing.
service StudentService {
  // Unary: one request, one response. NOT_FOUND when the id does not exist.
  rpc GetStudent(GetStudentRequest) returns (Student);
  // Server streaming: one request, the students arrive one message at a time.
  rpc ListStudents(ListStudentsRequest) returns (stream Student);
  // Client streaming: send several students, get one summary back. Needs the x-api-key metadata.
  rpc EnrollStudents(stream NewStudent) returns (EnrollSummary);
  // Bidirectional streaming: the help desk answers every message you send.
  rpc HelpDesk(stream ChatMessage) returns (stream ChatMessage);
}

enum Programme {
  PROGRAMME_UNSPECIFIED = 0;
  PHYSICS = 1;
  CHEMISTRY = 2;
  MATHEMATICS = 3;
  HISTORY = 4;
  COMPUTER_SCIENCE = 5;
}

message Student {
  int32 id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  Programme programme = 5;
  int32 year = 6;
  bool active = 7;
}

message GetStudentRequest {
  int32 id = 1;
}

message ListStudentsRequest {
  // Leave unspecified for every programme.
  Programme programme = 1;
  // 1 to 50. Default 5.
  int32 limit = 2;
}

message NewStudent {
  string first_name = 1;
  string last_name = 2;
  Programme programme = 3;
  int32 year = 4;
}

message EnrollSummary {
  int32 received = 1;
  int32 enrolled = 2;
  repeated string rejected = 3;
  repeated int32 ids = 4;
}

message ChatMessage {
  string from = 1;
  string text = 2;
}
