# On every pull request: only the smoke group, on JDK 21. A minute of feedback before anyone reviews the PR.
name: PR smoke

on:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    # The key comes from a repository secret (Settings > Secrets and variables > Actions).
    # GitHub masks it as *** in every log. The base URL is not secret: a repository variable,
    # with the public Campus Lab when no variable is set.
    env:
      CAMPUS_API_KEY: ${{ secrets.CAMPUS_API_KEY }}
      CAMPUS_BASE_URL: ${{ vars.CAMPUS_BASE_URL || 'https://campus-lab-production.up.railway.app' }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -Dgroups=smoke tells surefire to run only TestNG tests in the "smoke" group.
      - name: Smoke tests
        run: mvn -B test -Dgroups=smoke
